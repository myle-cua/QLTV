worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==============================================================
    # 1. LOG FORMAT: JSON structured log để Promtail đẩy về Loki
    # ==============================================================
    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.json.log json_analytics;

    # ==============================================================
    # 2. HARDENING (Tiêu chí 6): Ẩn phiên bản Nginx & Rate Limiting
    # ==============================================================
    server_tokens off;

    # Giới hạn 15 requests/giây cho mỗi IP để chống DoS / brute-force
    limit_req_zone $binary_remote_addr zone=library_limit:10m rate=15r/s;

    # Tối ưu hóa hiệu năng truyền tải
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream kết nối tới ứng dụng web quản lý thư viện
    upstream library_backend {
        server library-web:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # ==========================================================
        # 3. SECURITY HEADERS (Tiêu chí 3 & 6)
        # ==========================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; style-src 'self' https: 'unsafe-inline'; font-src 'self' https: data:;" always;

        # Chặn các truy cập vào file ẩn nguy hiểm (.env, .git...)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Reverse Proxy chuyển tiếp vào Web App
        location / {
            limit_req zone=library_limit burst=30 nodelay;

            proxy_pass http://library_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Trang thông báo lỗi hệ thống thân thiện
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
