server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Thu thập access log dạng JSON từ Nginx Reverse Proxy
  - job_name: nginx-json-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          env: production
          __path__: /var/log/nginx/access.json.log
    pipeline_stages:
      - json:
          expressions:
            status: status
            method: request_method
            uri: request_uri
            request_time: request_time
            remote_addr: remote_addr
      - labels:
          status:
          method:
